## Description: Deploys the main branch to the server by pulling the latest code over SSH.
name: Deploy Main

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH }}"
            git config --global --add safe.directory "${{ secrets.DEPLOY_PATH }}"
            for attempt in 1 2 3 4 5; do
              if getent hosts github.com >/dev/null 2>&1 && git fetch origin main; then
                break
              fi

              if [ "$attempt" = "5" ]; then
                echo "git fetch origin main failed after 5 attempts"
                exit 1
              fi

              echo "git fetch origin main failed, retrying in 5 seconds (attempt $attempt/5)"
              sleep 5
            done
            git checkout main
            git pull --ff-only origin main
            git rev-parse --short=12 HEAD > .deploy_asset_version
