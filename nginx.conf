# Description: Nginx server configuration for serving the PHP/WoWonder app directly without any Nuxt proxy.
server {
    server_name vnseea.vn www.vnseea.vn mail.vnseea.vn webmail.vnseea.vn admin.vnseea.vn;
    listen 443 ssl;
    listen [::]:443 ssl;

    root /home/vnseea/main/social;
    index index.php index.html index.htm;
    charset utf-8;
    client_max_body_size 512M;

    access_log /var/log/virtualmin/vnseea.vn_access_log;
    error_log /var/log/virtualmin/vnseea.vn_error_log;

    ssl_certificate /etc/letsencrypt/live/vnseea.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vnseea.vn/privkey.pem;

    location ^~ /.well-known/ {
        try_files $uri /;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    location ^~ /realtime/ {
        proxy_pass http://127.0.0.1:3025/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
    }

    location /mobile-socket/socket.io/ {
        proxy_pass http://127.0.0.1:3026/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_buffering off;
    }

    location /socket.io/ {
        proxy_pass http://127.0.0.1:3025/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_buffering off;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ \.phtml$ {
        deny all;
        return 404;
    }

    location ~ /cache {
        deny all;
        return 404;
    }

    location /sources {
        deny all;
        return 404;
    }

    location /nodejs {
        deny all;
        return 404;
    }

    location /adminPages/ {
        alias /home/vnseea/main/social/admin-panel/;
    }

    location ^~ /upload/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        access_log off;
    }

    location ^~ /themes/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    location = /admincp {
        rewrite ^(.*)$ /admincp.php last;
    }

    location /admincp {
        rewrite ^/admincp/(.*)$ /admincp.php?page=$1 last;
    }

    location /admin {
        rewrite ^/admin-cp$ /admincp.php last;
        rewrite ^/admin-cp/(.*)$ /admincp.php?page=$1 last;
        rewrite ^/admin/ads/edit/(\d+)(/?|)$ /index.php?link1=manage-ads&id=$1 last;
    }

    location /api {
        rewrite ^/api(/?|)$ /api-v2.php last;
        rewrite ^/api/([^\/]+)(\/|)$ /api-v2.php?type=$1 last;
    }

    location / {
        if (!-e $request_filename) {
            rewrite ^/password-reset/([^\/]+)(\/|)$ /index.php?link1=welcome&link2=password_reset&user_id=$1;
        }
        rewrite ^/$ /index.php?link1=home;
        rewrite "^/forum/members/([a-zA-Z]{0,1})(/?|)$" /index.php?link1=forum-members-byname&char=$1;
        if (!-e $request_filename) {
            rewrite ^/setting/([A-Za-z0-9_-]+)$ /index.php?link1=setting&page=$1;
        }
        if (!-e $request_filename) {
            rewrite ^/@([^\/]+)(\/|)$ /index.php?link1=timeline&u=$1;
        }
        if (!-e $request_filename) {
            rewrite ^/([A-Za-z0-9_]+)/([^\/]+)(\/|)$ /index.php?link1=timeline&u=$1&type=$2;
        }
        if (!-e $request_filename) {
            rewrite ^/([^\/]+)(\/|)$ /index.php?link1=timeline&u=$1;
        }
        try_files $uri $uri/ /index.php?$query_string;
    }

    location /start {
        rewrite ^/start-up(/?|)$ /index.php?link1=start-up last;
    }

    location /watch {
